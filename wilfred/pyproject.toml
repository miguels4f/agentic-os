[project]
name = "wilfred"
version = "0.1.0"
description = "Wilfred builds, improves, and reviews software and creates executable agentic systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0",
    "pydantic>=2.0",
    "pyyaml>=6",
]

[project.scripts]
wilfred = "hyperwilfred_core.cli:main"
hw = "hyperwilfred_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperwilfred_core"]

# Package-local step instructions are included with the Python package by Hatch.
# Also place the two adapter skills in that package so a wheel installed outside
# this checkout remains self-contained. The package name is retained for compatibility.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "hyperwilfred_core/skills"

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived generated runners are immutable execution evidence, not maintained modules.
extend-exclude = ["docs/evidence/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/", "^docs/evidence/"]

[tool.pytest.ini_options]
# pythonpath makes the suite robust to editable-install state — it always resolves the
# package from src/, whether or not `uv sync` has linked it into the venv.
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
